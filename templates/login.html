{% extends "base.html" %}
{% block title %}Log in · AW Portal{% endblock %}
{% block content %}
<div class="login-card">
  <h1>AW Client Report Portal</h1>
  <p class="muted">Enter the shared team password to continue.</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <label>
      <span>Password</span>
      <input type="password" name="password" required autofocus>
    </label>
    <button type="submit" class="primary">Log in</button>
  </form>
</div>
{% endblock %}
